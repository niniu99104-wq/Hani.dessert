<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hani. 經典蛋黃酥 · 訂購與查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F0E6; --card: #FFFDF9; --bean: #7A4A3A; --bean-deep: #5C3427;
    --yolk: #D98A3D; --yolk-soft: #E9B679; --ink: #3A2B24; --muted: #96897E;
    --line: #E5D8C6; --ok: #5B7A4F; --warn: #B4552F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Serif TC",serif;background:var(--paper);color:var(--ink);line-height:1.7;padding:0 0 120px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}

  /* 頂部切換頁籤 */
  .nav-tabs { display:flex; justify-content:center; gap:20px; padding:20px 0 10px; background:var(--paper); position:sticky; top:0; z-index:30; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .nav-tabs button { background:none; border:none; font-family:"Noto Sans TC",sans-serif; font-size:16px; font-weight:700; color:var(--muted); padding:10px 4px; cursor:pointer; position:relative; }
  .nav-tabs button.active { color:var(--bean-deep); }
  .nav-tabs button.active::after { content:''; position:absolute; bottom:-1px; left:0; width:100%; height:3px; background:var(--yolk); border-radius:2px 2px 0 0; }

  /* Hero & Banner */
  .hero{text-align:center;padding:24px 20px 28px;position:relative;}
  .hero .brand{font-size:13px;letter-spacing:.5em;color:var(--yolk);font-family:"Noto Sans TC",sans-serif;font-weight:600;padding-left:.5em;}
  .hero h1{font-size:30px;font-weight:700;color:var(--bean-deep);margin:10px 0 6px;}
  .hero .sub{color:var(--muted);font-size:14px;font-family:"Noto Sans TC",sans-serif}
  .soldout-banner { background: var(--bean-deep); color: #fff; text-align: center; padding: 12px; font-family: "Noto Sans TC", sans-serif; font-weight: 700; display: none; }

  /* 卡片與表單 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:18px;box-shadow:0 4px 16px rgba(122,74,58,.04);}
  .card h2{font-size:18px;color:var(--bean);margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  
  .prod{display:flex;gap:14px;align-items:flex-start}
  .prod .pname{font-size:17px;font-weight:700;color:var(--bean-deep)}
  .prod .pprice{color:var(--yolk);font-weight:700;font-family:"Noto Sans TC",sans-serif}
  
  label.field{display:block;margin-top:16px}
  .field .lab{font-size:13px;color:var(--bean);font-weight:600;font-family:"Noto Sans TC",sans-serif;margin-bottom:6px;display:block;}
  .field .req{color:var(--warn)}
  input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:"Noto Sans TC",sans-serif;font-size:15px;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yolk);box-shadow:0 0 0 3px rgba(217,138,61,.15);}
  textarea{min-height:80px;resize:vertical;}
  
  /* 按鈕與底部列 */
  .btn{background:var(--yolk);color:#3A2B24;font-weight:700;border:none;border-radius:10px;padding:13px 22px;font-family:"Noto Sans TC",sans-serif;font-size:15px;cursor:pointer;width:100%;}
  .btn:disabled{background:#CDBFA9;cursor:not-allowed;}
  .summary{position:fixed;left:0;right:0;bottom:0;background:var(--bean-deep);color:#fff;padding:14px 20px calc(14px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -4px 20px rgba(92,52,39,.25);}
  .summary .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .summary .breakdown{flex:1;font-family:"Noto Sans TC",sans-serif;font-size:13px;color:var(--yolk-soft);}
  .summary .total{font-size:22px;font-weight:700;font-family:"Noto Sans TC",sans-serif}

  /* 完成畫面 */
  .done{display:none;text-align:center;padding:40px 20px}
  .done h2{color:var(--bean-deep);font-size:24px;margin-bottom:10px}
  .copybox{background:#FBF4E9;border:1px solid var(--yolk-soft);border-radius:12px;padding:16px;margin:20px auto;max-width:340px;}
  .copyno{font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:22px;color:var(--bean-deep); margin:10px 0;}
  .pay-btn{display:inline-block;background:var(--bean-deep);color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:700;margin-top:10px;}
</style>
</head>
<body>
  
  <div class="nav-tabs">
    <button id="tabFormBtn" class="active">我要訂購</button>
    <button id="tabSearchBtn">訂單查詢</button>
  </div>

  <div id="soldOutBanner" class="soldout-banner"></div>

  <div class="wrap">
    <!-- ================= 訂購表單 ================= -->
    <div id="viewForm">
      <div class="hero">
        <div class="brand">hani&nbsp;dessert.</div>
        <h1>經典蛋黃酥 <span style="color:var(--yolk)">☻</span> 訂購單</h1>
        <div class="sub">接單製作 · 純手工預訂制</div>
      </div>

      <form id="orderForm">
        <!-- 1. 商品區 -->
        <div class="card">
          <h2>商品選擇</h2>
          <div class="prod">
            <div style="flex:1;">
              <div class="pname">烏豆沙蛋黃酥 6 入禮盒</div>
              <div class="pprice">NT$ 520 / 盒</div>
              <label class="field">
                <select name="qty" id="qtySelect" required>
                  <option value="1">1 盒</option><option value="2">2 盒</option>
                  <option value="3">3 盒</option><option value="4">4 盒</option>
                  <option value="5">5 盒</option><option value="6">6 盒 (超商上限)</option>
                  <option value="7">7 盒</option><option value="8">8 盒</option>
                </select>
              </label>
            </div>
          </div>
        </div>

        <!-- 2. 取貨與配送 -->
        <div class="card">
          <h2>取貨與配送設定</h2>
          <label class="field">
            <span class="lab">取貨日期 <span class="req">*</span></span>
            <select name="pickup" id="pickupSelect" required>
              <option value="">載入日期中...</option>
              <!-- 這裡會由 GAS doGet 自動填入開放日期 -->
            </select>
          </label>
          <label class="field">
            <span class="lab">配送方式 <span class="req">*</span></span>
            <select name="deliv" id="delivSelect" required>
              <option value="自取">台南工作室自取 (免運)</option>
              <option value="超商">超商店到店 (運費 $60, 限6盒)</option>
              <option value="新竹物流">新竹物流宅配</option>
            </select>
          </label>
          
          <!-- 動態顯示的欄位 (CSS控制隱藏) -->
          <div id="extraFields" style="display:none; margin-top:10px; padding:10px; background:#FBF4E9; border-radius:8px;">
             <label class="field" id="storeField" style="display:none; margin-top:0;">
                <span class="lab">超商門市名稱/代號</span>
                <input type="text" name="store" placeholder="例如：7-11 某某門市">
             </label>
             <label class="field" id="addressField" style="display:none; margin-top:0;">
                <span class="lab">宅配詳細地址</span>
                <input type="text" name="address" placeholder="請填寫縣市與完整地址">
             </label>
          </div>
        </div>

        <!-- 3. 顧客資料 -->
        <div class="card">
          <h2>訂購人資料</h2>
          <label class="field">
            <span class="lab">訂購人姓名 <span class="req">*</span></span>
            <input type="text" name="name" required>
          </label>
          <label class="field">
            <span class="lab">手機號碼 <span class="req">*</span></span>
            <input type="tel" name="phone" required placeholder="0912345678">
          </label>
          <label class="field">
            <span class="lab">LINE ID / IG 帳號 (方便聯繫)</span>
            <input type="text" name="social">
          </label>

          <!-- 隱藏欄位，如果有需要分開收件人，這版預設同訂購人 -->
          <input type="hidden" name="rname" id="rname">
          <input type="hidden" name="rphone" id="rphone">
          <!-- 你的後端需要的欄位 -->
          <input type="hidden" name="pay" value="線上付款 (PAYUNi)"> 
          <input type="hidden" name="slot" value=""> 

          <label class="field">
            <span class="lab">備註</span>
            <textarea name="remark" placeholder="如有特殊需求請備註..."></textarea>
          </label>
        </div>
      </form>
    </div>

    <!-- ================= 訂單查詢 (靜態示意區) ================= -->
    <div id="viewSearch" style="display:none; padding-top:20px;">
      <div class="card">
        <h2>查詢訂單</h2>
        <p style="font-size:13px; color:var(--muted); margin-bottom:10px;">訂單查詢功能建置中，如需確認訂單狀態請私訊官方 LINE。</p>
      </div>
    </div>

    <!-- ================= 完成畫面 ================= -->
    <div id="viewDone" class="done">
      <h2>🎉 訂單已建立！</h2>
      <p style="color: var(--muted); font-size:14px;">請截圖保留您的訂單編號，並盡速完成付款以保留名額。</p>
      
      <div class="copybox">
        <div style="font-size:13px; color:var(--muted);">您的訂單編號</div>
        <div class="copyno" id="doneOrderNo">讀取中...</div>
      </div>

      <div style="margin-top: 20px;">
        <a href="#" id="payBtn" class="pay-btn" target="_blank">前往付款 ➔</a>
      </div>
    </div>
  </div> <!-- end wrap -->

  <!-- 底部結帳列 -->
  <div class="summary" id="summaryBar">
    <div class="inner">
      <div class="breakdown">
        小計 <span id="sumGoods">520</span> + 運 <span id="sumShip">0</span>
      </div>
      <div class="total"><small>NT$ </small><span id="sumTotal">520</span></div>
      <button class="btn" id="submitBtn" style="width: auto;">送出訂單</button>
    </div>
  </div>

  <script>
    // ★★★★★ 請替換成你部署的 GAS Web App 網址 ★★★★★
    const GAS_URL = "https://script.google.com/macros/s/你的部署ID/exec"; 

    // --- DOM ---
    const orderForm = document.getElementById("orderForm");
    const qtySelect = document.getElementById("qtySelect");
    const delivSelect = document.getElementById("delivSelect");
    const pickupSelect = document.getElementById("pickupSelect");
    const submitBtn = document.getElementById("submitBtn");
    
    // --- 參數設定 (同步你的 Code.gs) ---
    const PRICE = 520;

    // --- 運費與總價計算 ---
    function calcTotal() {
      const qty = parseInt(qtySelect.value);
      const deliv = delivSelect.value;
      
      // 計算商品總價
      const goods = qty * PRICE;
      
      // 運費邏輯 (完全對齊 computeShip_)
      let ship = 0;
      if (deliv === "超商") ship = 60;
      else if (deliv === "新竹物流") ship = (qty >= 5) ? 100 : 65;

      document.getElementById("sumGoods").innerText = goods.toLocaleString();
      document.getElementById("sumShip").innerText = ship.toLocaleString();
      document.getElementById("sumTotal").innerText = (goods + ship).toLocaleString();

      // UI 顯示控制：如果是超商，顯示門市欄位；如果是宅配，顯示地址欄位
      const extraFields = document.getElementById("extraFields");
      const storeF = document.getElementById("storeField");
      const addrF = document.getElementById("addressField");
      
      if (deliv === "自取") {
        extraFields.style.display = "none";
      } else {
        extraFields.style.display = "block";
        storeF.style.display = (deliv === "超商") ? "block" : "none";
        addrF.style.display = (deliv === "新竹物流") ? "block" : "none";
      }
    }

    qtySelect.addEventListener("change", calcTotal);
    delivSelect.addEventListener("change", calcTotal);

    // --- 頁面載入時：向 GAS 抓取開放的取貨日 (呼叫 doGet) ---
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => {
        if(data.ok && data.dates) {
          pickupSelect.innerHTML = '<option value="">請選擇取貨日</option>';
          data.dates.forEach(date => {
             // 讀取剩餘數量 (對齊 getRemainingByDate_)
             let remain = data.remaining[date] !== undefined ? data.remaining[date] : data.dailyLimit;
             let opt = document.createElement("option");
             opt.value = date;
             opt.innerText = `${date} (剩餘 ${remain} 盒)`;
             if(remain <= 0) opt.disabled = true;
             pickupSelect.appendChild(opt);
          });
          
          // 如果設定檔有開完售橫幅
          if(data.banner && data.banner.show) {
             const banner = document.getElementById("soldOutBanner");
             banner.innerText = data.banner.text;
             banner.style.display = "block";
          }
        }
      })
      .catch(err => {
        pickupSelect.innerHTML = '<option value="">系統維護中，請手動輸入</option>';
      });

    // --- 表單送出 (對齊 doPost 與 JSON.parse(e.postData.contents)) ---
    submitBtn.addEventListener("click", () => {
      if (!orderForm.checkValidity()) {
        orderForm.reportValidity();
        return;
      }

      // 將收件人自動設為訂購人
      document.getElementById("rname").value = orderForm.name.value;
      document.getElementById("rphone").value = orderForm.phone.value;

      submitBtn.disabled = true;
      submitBtn.innerText = "寫入資料中...";

      // 將 FormData 轉成 JS 物件
      const formData = new FormData(orderForm);
      const payload = {};
      formData.forEach((value, key) => { payload[key] = value; });

      // ★ 判斷是否為週末新竹物流 (同步 GAS weekendKuro 參數)
      const d = new Date(payload.pickup);
      const isWeekend = (d.getDay() === 0 || d.getDay() === 6);
      payload.weekendKuro = (payload.deliv === "新竹物流" && isWeekend);

      // ★ 重點：必須送出字串化的 JSON，讓 GAS 的 JSON.parse 接得住！
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: {
            "Content-Type": "text/plain;charset=utf-8" // 避免 CORS 預檢問題
        }
      })
      .then(response => response.json())
      .then(result => {
        if (result.ok) {
          // 切換畫面
          document.getElementById("viewForm").style.display = "none";
          document.getElementById("summaryBar").style.display = "none";
          document.querySelector(".nav-tabs").style.display = "none";
          
          // 顯示回傳的訂單編號與付款連結
          document.getElementById("doneOrderNo").innerText = result.data.orderNo;
          if (result.data.payUrl) {
            document.getElementById("payBtn").href = result.data.payUrl;
          }
          document.getElementById("viewDone").style.display = "block";
          window.scrollTo(0,0);
        } else {
          alert("送單失敗：" + result.error);
          submitBtn.disabled = false;
          submitBtn.innerText = "送出訂單";
        }
      })
      .catch(error => {
        alert("網路連線異常，請稍後再試！");
        submitBtn.disabled = false;
        submitBtn.innerText = "送出訂單";
      });
    });

    // --- 頁籤切換邏輯 ---
    document.getElementById("tabFormBtn").addEventListener("click", function(){
      this.classList.add("active"); document.getElementById("tabSearchBtn").classList.remove("active");
      document.getElementById("viewForm").style.display = "block";
      document.getElementById("viewSearch").style.display = "none";
      document.getElementById("summaryBar").style.display = "block";
    });
    document.getElementById("tabSearchBtn").addEventListener("click", function(){
      this.classList.add("active"); document.getElementById("tabFormBtn").classList.remove("active");
      document.getElementById("viewForm").style.display = "none";
      document.getElementById("viewSearch").style.display = "block";
      document.getElementById("summaryBar").style.display = "none";
    });

  </script>
</body>
</html>
