/* =========================================================
 * Vanilla 香草籽甜點. 線上訂購｜樣式
 * 想調整顏色：只要修改下方 :root 裡的色票即可
 * ========================================================= */
:root {
  --bg: #F5F1EA;            /* 頁面底色（米白） */
  --surface: #FCFAF6;       /* 區塊底色（奶油白） */
  --surface-soft: #ECE5DA;  /* 圖片預留區、淺底 */
  --line: #E2D9CC;          /* 細線 */
  --text: #3A3430;          /* 主要文字（暖深灰） */
  --text-sub: #6B625A;      /* 次要文字 */
  --muted: #9B9187;         /* 提示文字 */
  --accent: #5B524A;        /* 主要按鈕（暖灰褐） */
  --accent-press: #473F38;
  --accent-soft: #E8E0D4;
  --danger: #9E5A4C;        /* 錯誤提示（低飽和磚紅） */
  --danger-soft: #F4E8E3;
  --line-green: #06C755;    /* LINE 按鈕 */

  --radius-lg: 18px;
  --radius: 12px;
  --radius-sm: 10px;

  --font-sans: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
  --font-serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-brand: "Cormorant Garamond", "Noto Serif TC", Georgia, serif;

  --page-max: 560px;

  /* 統一高度：主要按鈕／次要按鈕／輸入框（數量按鈕也用 --h-input） */
  --h-primary: 56px;
  --h-secondary: 48px;
  --h-input: 52px;
  --h-option: 78px;   /* 配送、付款選項同高（容得下兩行文字） */
  --sticky-h: var(--h-primary);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 20px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
